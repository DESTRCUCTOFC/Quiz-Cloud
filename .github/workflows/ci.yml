name: QuizCloud CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and Check Backend API
        working-directory: ./apps/api
        run: |
          npm install
          npm run lint
          npm run typecheck
          npm run build

      - name: Install and Check Frontend Web
        working-directory: ./apps/web
        run: |
          npm install
          npm run lint
          npm run build
