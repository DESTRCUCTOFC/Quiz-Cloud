databases:
  - name: quizcloud-db
    plan: free
    databaseName: quizcloud
    user: quizuser

services:
  - type: web
    name: quizcloud-api
    runtime: docker
    dockerfilePath: ./docker/api.Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: quizcloud-db
          property: connectionString
      - key: CORS_ORIGIN
        value: "*"
